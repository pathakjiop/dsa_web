<style>
:root{--black:#0a0908;--bord:#49111c;--smoke:#f2f4f3;--taupe:#a9927d;--stone:#5e503f;

:root[data-theme="light"]{--bg:var(--smoke);--fg:var(--black);--mut:var(--stone);--line:#d8d0c7;--card:rgba(10,9,8,.03);--glow:rgba(169,146,125,.45)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(900px 420px at 15% -5%,var(--glow),transparent 70%),var(--bg);background-color:var(--bg);color:var(--fg);font:15px/1.5 Georgia,'Times New Roman',serif}
main{max-width:720px;margin:0 auto;padding:64px 20px 90px}
.eye{font:600 11px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.28em;color:var(--mut);text-transform:uppercase;margin-bottom:18px}
h1{font-size:clamp(38px,8vw,60px);line-height:1.04;font-weight:400;margin:0 0 14px;letter-spacing:-.02em}
h1 em{color:var(--mut)}
.sub{color:var(--mut);margin:0 0 34px;max-width:420px}
.stats{display:flex;align-items:flex-end;gap:18px;margin-bottom:12px}
.big{font-size:44px;line-height:1;letter-spacing:-.02em}.big small{font-size:18px;color:var(--mut)}
.pct{margin-left:auto;color:var(--mut);font:13px ui-sans-serif,system-ui,sans-serif}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:30px}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--bord),var(--taupe));transition:width .5s}
.next{display:flex;align-items:center;gap:16px;padding:18px 20px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(120deg,var(--bord),transparent 120%),var(--card);margin-bottom:30px;text-decoration:none;color:inherit;transition:transform .2s}
.next:hover{transform:translateY(-2px)}
.next .l{font:600 10px ui-sans-serif,system-ui,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--taupe)}
.next .t{font-size:19px;margin-top:4px;color:var(--smoke)}.next .s{font-size:13px;color:var(--taupe)}
.next .go{margin-left:auto;font-size:22px;color:var(--smoke)}
input[type=search]{width:100%;padding:13px 18px;background:var(--card);border:1px solid var(--line);border-radius:99px;color:var(--fg);font:inherit;outline:none;margin-bottom:22px}
input[type=search]:focus{border-color:var(--mut)}
details{border:1px solid var(--line);border-radius:16px;background:var(--card);margin-bottom:10px;transition:border-color .2s}
details[open]{border-color:var(--stone)}
summary{cursor:pointer;padding:16px 18px;list-style:none;display:flex;align-items:center;gap:14px}
summary::-webkit-details-marker{display:none}
.n{font:12px ui-sans-serif,system-ui,sans-serif;color:var(--mut);opacity:.7;width:20px}
.nm{flex:1;font-size:17px}
.mini{width:54px;height:3px;border-radius:9px;background:var(--line);overflow:hidden}.mini i{display:block;height:100%;background:var(--mut)}
.ct{font:12px ui-sans-serif,system-ui,sans-serif;color:var(--mut);width:38px;text-align:right}
summary:after{content:'+';color:var(--mut);font-size:18px;width:14px;text-align:center}
details[open] summary:after{content:'–'}
.sec{padding:0 18px 12px;border-top:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border:0}
.row input{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1.5px solid var(--mut);border-radius:50%;flex:none;margin:0;cursor:pointer;position:relative;transition:.2s}
.row input:checked{background:var(--mut)}
.row input:checked:after{content:'';position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
.row a,.row em{flex:1;color:var(--fg);text-decoration:none;font-style:normal}
.row a:hover{color:var(--mut)}
.row.done a,.row.done em{color:var(--mut);opacity:.6;text-decoration:line-through}
.tag{font:600 10px ui-sans-serif,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid var(--mut);color:var(--mut)}
.tag.m{background:var(--stone);border-color:var(--stone);color:var(--smoke)}
.tag.h{background:var(--bord);border-color:var(--bord);color:var(--smoke)}
</style></head><body><main>

const U=s=>!s?'':s.startsWith('http')?s:s.startsWith('g:')?'https://www.geeksforgeeks.org/problems/'+s.slice(2):'https://leetcode.com/problems/'+s+'/';
const S=[];D.split('\n').forEach(r=>{if(r[0]=='#')S.push({n:r.slice(2),i:[]});else{const[t,s]=r.split('|');S.at(-1).i.push({id:t+'|'+(s||''),t,u:U(s)})}});
let done={};try{done=JSON.parse(localStorage.getItem('dsa')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('dsa',JSON.stringify(done))}catch(e){}};
const L=document.getElementById('l'),all=S.reduce((a,s)=>a+s.i.length,0);
const open={};
const dif=t=>{const m=t.match(/\((easy|medium|med|hard)\)/i);return m?{t:t.replace(m[0],'').trim(),d:m[1].toLowerCase()}:{t,d:''}};
function render(){const q=document.getElementById('q').value.toLowerCase();
L.innerHTML='';
S.forEach((s,si)=>{const items=s.i.filter(x=>x.t.toLowerCase().includes(q)||(q&&s.n.toLowerCase().includes(q)));
const d=s.i.filter(x=>done[x.id]).length;
if(!items.length)return;
const el=document.createElement('details');if(q||open[si])el.open=true;
el.ontoggle=()=>{if(!q)open[si]=el.open};
el.innerHTML=`<summary><span class="n">${String(si+1).padStart(2,'0')}</span><span class="nm">${s.n}</span><span class="mini"><i style="width:${d/s.i.length*100}%"></i></span><span class="ct">${d}/${s.i.length}</span></summary><div class="sec"></div>`;
const box=el.lastChild;
items.forEach(x=>{const f=dif(x.t),r=document.createElement('label');r.className='row'+(done[x.id]?' done':'');
const tg=f.d?`<span class="tag ${f.d[0]=='h'?'h':f.d[0]=='e'?'':'m'}">${f.d=='med'?'medium':f.d}</span>`:'';
r.innerHTML=`<input type="checkbox" ${done[x.id]?'checked':''}>${x.u?`<a href="${x.u}" target="_blank" rel="noopener">${f.t}</a>`:`<em>${f.t}</em>`}${tg}`;
r.firstChild.onchange=e=>{e.target.checked?done[x.id]=1:delete done[x.id];save();render()};
box.appendChild(r)});
L.appendChild(el)});
const n=Object.keys(done).length;
document.getElementById('p').style.width=(n/all*100)+'%';
document.getElementById('s').innerHTML=n+'<small> / '+all+' solved</small>';
document.getElementById('pc').textContent=Math.round(n/all*100)+'% complete';
let nx=null;for(const s of S){const x=s.i.find(x=>!done[x.id]&&x.u);if(x){nx={s,x};break}}
document.getElementById('nx').innerHTML=nx?`<a class="next" href="${nx.x.u}" target="_blank" rel="noopener"><div><div class="l">Up next</div><div class="t">${dif(nx.x.t).t}</div><div class="s">${nx.s.n}</div></div><span class="go">→</span></a>`:'';}
document.getElementById('q').oninput=render;render();
</script></body></html>
